<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found — The page you're looking for doesn't exist or has been moved.">
    <title>404 — Page Not Found | LensGlow</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cellipse cx='50' cy='50' rx='38' ry='32' fill='%230EA5E9' opacity='0.15' stroke='%230EA5E9' stroke-width='2.5'/%3E%3Ccircle cx='50' cy='50' r='8' fill='%230EA5E9'/%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{primary:'#0EA5E9',secondary:'#0F172A'}}}}</script>
</head>
<body>
    <div class="utility-page" id="page-404">
        <!-- Top-right icons -->
        <div class="auth-top-icons">
            <button class="icon-btn dark-toggle" title="Toggle Dark Mode"><i class="fas fa-moon"></i></button>
            <button class="icon-btn rtl-toggle" title="Toggle RTL"><i class="fas fa-exchange-alt"></i></button>
        </div>

        <div class="utility-content">
            <!-- Logo -->
            <a href="index.html" style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:32px;font-family:'Outfit',sans-serif;font-weight:700;font-size:1.2rem;color:var(--text-dark);" id="logo-404">
                <svg width="36" height="36" viewBox="0 0 100 100" fill="none">
                    <ellipse cx="50" cy="50" rx="38" ry="32" fill="var(--logo-glass-fill)" stroke="var(--logo-primary)" stroke-width="2.5"/>
                    <ellipse cx="50" cy="50" rx="22" ry="18" fill="var(--logo-beam-fill)" stroke="var(--logo-primary)" stroke-width="1.5"/>
                    <circle cx="50" cy="50" r="8" fill="var(--logo-primary)" opacity="0.9"/>
                    <circle cx="50" cy="50" r="4" fill="var(--logo-glow)"/>
                    <path d="M68 38 L92 22" stroke="var(--logo-primary)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
                    <path d="M72 50 L96 50" stroke="var(--logo-primary)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
                    <path d="M68 62 L92 78" stroke="var(--logo-primary)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
                </svg>
                LensGlow
            </a>

            <!-- Broken Headlight Illustration -->
            <div style="margin-bottom:24px;">
                <svg width="180" height="180" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin:0 auto;animation:float 3s ease-in-out infinite;">
                    <!-- Outer glow ring -->
                    <circle cx="100" cy="100" r="90" fill="none" stroke="#0EA5E9" stroke-width="1" opacity="0.15"/>
                    <circle cx="100" cy="100" r="78" fill="none" stroke="#0EA5E9" stroke-width="1" opacity="0.1"/>
                    <!-- Headlight housing -->
                    <ellipse cx="100" cy="100" rx="70" ry="55" fill="#0EA5E9" fill-opacity="0.08" stroke="#0EA5E9" stroke-width="2.5" opacity="0.7"/>
                    <ellipse cx="100" cy="100" rx="45" ry="35" fill="#0EA5E9" fill-opacity="0.12" stroke="#0EA5E9" stroke-width="1.8" opacity="0.6"/>
                    <!-- Dim bulb -->
                    <circle cx="100" cy="100" r="16" fill="#0EA5E9" opacity="0.15"/>
                    <circle cx="100" cy="100" r="8" fill="#0EA5E9" opacity="0.3"/>
                    <circle cx="100" cy="100" r="3" fill="#38BDF8" opacity="0.5"/>
                    <!-- Crack lines (more visible) -->
                    <path d="M100 52 L94 78 L110 92 L90 112 L106 145" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
                    <path d="M94 78 L74 87" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
                    <path d="M110 92 L130 86" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
                    <path d="M90 112 L72 118" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.3"/>
                    <!-- Dim fading light rays -->
                    <path d="M148 80 L172 64" stroke="#0EA5E9" stroke-width="2" stroke-linecap="round" opacity="0.2" stroke-dasharray="4 4"/>
                    <path d="M153 100 L178 100" stroke="#0EA5E9" stroke-width="2" stroke-linecap="round" opacity="0.2" stroke-dasharray="4 4"/>
                    <path d="M148 120 L172 136" stroke="#0EA5E9" stroke-width="2" stroke-linecap="round" opacity="0.2" stroke-dasharray="4 4"/>
                    <!-- X eyes -->
                    <line x1="84" y1="90" x2="92" y2="98" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
                    <line x1="92" y1="90" x2="84" y2="98" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
                    <line x1="108" y1="90" x2="116" y2="98" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
                    <line x1="116" y1="90" x2="108" y2="98" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
                    <!-- Sad mouth -->
                    <path d="M88 118 Q100 110 112 118" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
                </svg>
            </div>

            <h1 style="font-size:4.5rem;font-family:'Outfit',sans-serif;font-weight:800;color:var(--primary);line-height:1.1;">404</h1>
            <h2 style="font-size:1.8rem;margin:8px 0 12px;">Looks Like This Light Went Out</h2>
            <p style="color:var(--text-muted);font-size:0.95rem;margin-bottom:24px;max-width:380px;margin-left:auto;margin-right:auto;">The page you're looking for doesn't exist or has been moved. Let us guide you back to brightness.</p>
            <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
                <a href="index.html" class="btn btn-primary" id="btn-go-home"><i class="fa-solid fa-house"></i> Go Home</a>
                <a href="services.html" class="btn btn-secondary" id="btn-browse-services">Browse Services</a>
            </div>

            <!-- Suggested Links -->
            <div style="margin-top:32px;padding-top:24px;border-top:1px solid var(--border-light);max-width:320px;margin-left:auto;margin-right:auto;">
                <p style="font-size:0.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;font-weight:600;">Suggested Links</p>
                <div style="display:flex;flex-direction:column;gap:10px;font-size:0.9rem;text-align:center;">
                    <a href="gallery.html" style="color:var(--primary);font-weight:600;"><i class="fa-solid fa-images" style="margin-right:6px;"></i> Before & After Gallery</a>
                    <a href="pricing.html" style="color:var(--primary);font-weight:600;"><i class="fa-solid fa-tag" style="margin-right:6px;color:var(--success);"></i> View Pricing</a>
                    <a href="booking.html" style="color:var(--primary);font-weight:600;"><i class="fa-solid fa-calendar-check" style="margin-right:6px;color:var(--warning);"></i> Book Appointment</a>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
